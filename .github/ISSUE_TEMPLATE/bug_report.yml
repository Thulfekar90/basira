name: Bug report
description: Basira crashed, printed an error, or behaved differently from what the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a result you believe is *wrong* (a clean file flagged, or an edit missed), please use the
        "False positive / false negative" form instead. For anything security-related, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command (or Python code) and its full output
      description: Add `--debug` to `basira scan` to include the traceback.
      render: console
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `basira doctor`
      render: console
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: A file that reproduces it
      description: >
        Attach the file exactly as it was analysed (zip it so that GitHub does not re-compress it), or say
        how to generate one. Only attach files you have the right to share, and nothing that identifies a
        private person.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 24.04, macOS 15 (Apple silicon), Windows 11"
    validations:
      required: true
