name: Release

# DISABLED BY DESIGN. Pushing a tag runs the build job, but nothing is uploaded until the
# repository owner has done all three of these, on purpose:
#
#   1. On PyPI, add a "trusted publisher" for the project `basira`: this repository,
#      workflow file `release.yml`, environment `pypi`.
#      (https://docs.pypi.org/trusted-publishers/ - no API token is stored anywhere.)
#   2. In this repository: Settings -> Environments -> create `pypi`, and add yourself as a
#      required reviewer so that every upload waits for a click.
#   3. In this repository: Settings -> Secrets and variables -> Actions -> Variables ->
#      add PYPI_PUBLISH = true.
#
# Without step 3 the publish job is skipped; without step 1 PyPI refuses the upload.
# docs/PUBLISHING.md says a PyPI release is the owner's decision; this file only makes it
# a one-tag operation once that decision has been taken. It has never been run.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in the code
        run: |
          python - <<'PY'
          import os, re
          src = open("basira/__init__.py", encoding="utf-8").read()
          version = re.search(r'^__version__ = "([^"]+)"', src, re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == "v" + version, f"tag {tag} does not match basira.__version__ {version}"
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - run: python .github/scripts/check_dist.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/basira
    permissions:
      id-token: write          # OpenID Connect token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
