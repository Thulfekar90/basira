[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basira"
version = "0.1.0"
description = "Explainable forensics for AI-generated and manipulated images, audio and video: where was it edited, and why do we think so."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["forensics", "deepfake", "image-forensics", "audio-forensics", "video-forensics",
            "tamper-detection", "ai-generated", "c2pa", "copy-move", "splicing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pillow>=9.5",
  "opencv-python-headless>=4.8",
  "soundfile>=0.12",
  "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
basira = "basira.cli:main"

[tool.setuptools.packages.find]
include = ["basira*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
